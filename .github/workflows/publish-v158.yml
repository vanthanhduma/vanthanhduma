name: Publish v1.5.8.0 Stable update

on:
  push:
    branches: [main]
    paths:
      - "video-studio-updates/upload-v1.5.8.0/READY"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and publish the verified update
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, shutil, subprocess, zipfile
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path(".")
          stage = root / "video-studio-updates" / "upload-v1.5.8.0"
          payload = stage / "payload"
          required = [
              "PHIEN_BAN.txt",
              "RELEASE_NOTES_V1_5_8_0.md",
              "app.py",
              "project_storage.py",
              "qt_app.py",
              "CAI_DAT_VA_CHAY.bat",
              "HUONG_DAN_CAI_DAT.txt",
          ]
          if not all((payload / name).is_file() for name in required):
              raise SystemExit("Missing one or more staged update files")

          asset_name = "Goc_Review_Phim_Video_Studio_v1.5.8.0_UPDATE.zip"
          asset = root / "video-studio-updates" / "stable" / "assets" / asset_name
          asset.parent.mkdir(parents=True, exist_ok=True)
          files = []
          with zipfile.ZipFile(asset, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for name in required:
                  data = (payload / name).read_bytes()
                  zf.writestr("payload/" + name, data)
                  files.append({
                      "path": name,
                      "size": len(data),
                      "sha256": hashlib.sha256(data).hexdigest(),
                      "action": "replace",
                  })
          with zipfile.ZipFile(asset) as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit("Corrupt ZIP member: " + bad)
          archive_bytes = asset.read_bytes()
          archive_sha = hashlib.sha256(archive_bytes).hexdigest()

          notes_path = root / "video-studio-updates" / "stable" / "RELEASE_NOTES_V1_5_8_0.md"
          notes = (payload / "RELEASE_NOTES_V1_5_8_0.md").read_text(encoding="utf-8-sig")
          notes_path.write_text(notes.rstrip() + "\n", encoding="utf-8")
          manifest = {
              "schema_version": 1,
              "app_id": "goc-review-phim-video-studio",
              "channel": "stable",
              "trust_mode": "https-sha256-v1",
              "package_type": "UPDATE",
              "version": "1.5.8.0",
              "base_version": "1.5.7.0",
              "minimum_supported_version": "1.5.7.0",
              "supported_base_versions": ["1.5.7.0"],
              "asset_name": asset_name,
              "asset_url": "https://raw.githubusercontent.com/vanthanhduma/vanthanhduma/main/video-studio-updates/stable/assets/" + asset_name,
              "asset_size": len(archive_bytes),
              "asset_sha256": archive_sha,
              "published_at": datetime.now(timezone.utc).isoformat(),
              "release_notes_url": "https://raw.githubusercontent.com/vanthanhduma/vanthanhduma/main/video-studio-updates/stable/RELEASE_NOTES_V1_5_8_0.md",
              "release_notes": notes.rstrip(),
              "files": files,
          }
          latest = root / "video-studio-updates" / "stable" / "latest.json"
          latest.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          shutil.rmtree(stage)
          (root / ".github" / "workflows" / "publish-v158.yml").unlink(missing_ok=True)
          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", "-A"], check=True)
          subprocess.run(["git", "commit", "-m", "Publish v1.5.8.0 Stable update"], check=True)
          subprocess.run(["git", "push", "origin", "main"], check=True)
          print(f"Published v1.5.8.0: {len(archive_bytes)} bytes, SHA256 {archive_sha}")
          PY
